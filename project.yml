name: ISORecorder
options:
  bundleIdPrefix: com.notandrewjones
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  ISOCore:
    path: Packages/ISOCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  ISORecorder:
    type: application
    platform: macOS
    sources:
      - App
      - Bridge
    dependencies:
      - package: ISOCore
        product: ISOCore
      - package: ISOCore
        product: ISOEngine
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: ISORecorder
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: App/ISORecorder-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # scripts/build_release.sh overrides these two with the Developer ID values.
        ISO_SIGN_IDENTITY: "-"
        ISO_DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "$(ISO_SIGN_IDENTITY)"
        DEVELOPMENT_TEAM: "$(ISO_DEVELOPMENT_TEAM)"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS: "\"$(DECKLINK_SDK_PATH)/Mac/include\""
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_ENTITLEMENTS: App/ISORecorder.entitlements
          ARCHS: arm64
